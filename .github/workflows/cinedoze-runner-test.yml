name: CineDoze network comparison
on:
  push:
    branches: [cinedoze-runner-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test public pages from GitHub runner
        run: |
          python3 - <<'PY' | tee /tmp/cinedoze-test.txt
          import urllib.request,urllib.error,re,time
          urls=['https://cinedoze.tv/','https://cinedoze.tv/?s=Project+Hail+Mary','https://cinedoze.tv/movies/lenin-pandiyan-2026-dual-audio-hindi-org-tamil-amazon/','https://cinedoze.tv/links/m1volkkome/','https://mlsbd.co/','https://savelinks.me/view/iNTi2twT','https://joya9links.com/view/ltCp85X6']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args):return None
          op=urllib.request.build_opener(NoRedirect)
          for u in urls:
           try:
            t=time.monotonic();req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'});r=op.open(req,timeout=18);b=r.read(250000);print('URL',u,'HTTP',r.status,'bytes',len(b),'seconds',round(time.monotonic()-t,2),'html',b[:15])
           except urllib.error.HTTPError as e:print('URL',u,'HTTP',e.code,'redirect',e.headers.get('Location',''))
           except Exception as e:print('URL',u,'ERROR',type(e).__name__)
          PY
      - name: Test site through freshly verified BD proxies
        working-directory: tools/mls-index-lab
        run: |
          python3 -m pip install requests >/dev/null
          python3 scan_bd.py >> /tmp/cinedoze-test.txt 2>&1
          python3 - <<'PY' | tee -a /tmp/cinedoze-test.txt
          import json,subprocess,concurrent.futures
          pool=[x['proxy'] for x in json.load(open('bd-results.json'))['good']][:12]
          targets=[('home','https://cinedoze.tv/'),('sitemap','https://cinedoze.tv/movies-sitemap.xml'),('link','https://cinedoze.tv/links/m1volkkome/')]
          def test(job):
           name,url,px=job
           try:
            r=subprocess.run(['curl','-sS','--connect-timeout','5','--max-time','12','--proxy',px,'-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36','-w','\n%{http_code}',url],capture_output=True,text=True,timeout=14)
            body,status=r.stdout.rsplit('\n',1);valid=(status=='200' and (('CineDoze' in body and 'Movies' in body) if name=='home' else '<urlset' in body if name=='sitemap' else False)) or (name=='link' and status in ['301','302'])
            return name,valid,status
           except Exception:return name,False,'error'
          jobs=[(n,u,px) for n,u in targets for px in pool]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:out=list(ex.map(test,jobs))
          for n,_ in targets:
           a=[x for x in out if x[0]==n];print('BD_PROXY_RESULT',n,'valid',sum(x[1] for x in a),'tested',len(a),'statuses',sorted(set(x[2] for x in a)))
          PY
      - name: Publish test summary to separate test branch
        if: always()
        run: |
          cp /tmp/cinedoze-test.txt /tmp/cinedoze-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan cinedoze-test-results
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/cinedoze-result.txt runner-result.txt
          git add runner-result.txt
          git commit -m 'CineDoze network test result'
          git push --force origin HEAD:cinedoze-test-results
