name: MLSBD proxy indexing runner test
on:
  push:
    branches: [mls-index-runner-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Scan and test BD proxies
        working-directory: tools/mls-index-lab
        run: |
          set -o pipefail
          python scan_bd.py 2>&1 | tee /tmp/mls-runner-scan.txt
      - name: Test indexing
        working-directory: tools/mls-index-lab
        run: |
          set -o pipefail
          python indexer.py --db runner.sqlite --proxy-list bd-results.json --pages 2 --mirror-limit 10 2>&1 | tee /tmp/mls-runner-index.txt
          python - <<'PY'
          import sqlite3,sys
          c=sqlite3.connect('runner.sqlite')
          posts=c.execute('select count(*) from posts').fetchone()[0]
          mirrors=c.execute('select count(*) from mirrors').fetchone()[0]
          print('RUNNER_RESULT posts=',posts,'mirror_sets=',mirrors)
          if posts<100 or mirrors<1:sys.exit(1)
          PY
      - name: Publish non-sensitive test summary to separate test branch
        if: always()
        run: |
          { echo "run $GITHUB_RUN_ID"; cat /tmp/mls-runner-scan.txt /tmp/mls-runner-index.txt 2>/dev/null || true; } > /tmp/mls-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan mls-index-results
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/mls-result.txt runner-result.txt
          git add runner-result.txt
          git commit -m 'MLSBD runner test result'
          git push --force origin HEAD:mls-index-results
