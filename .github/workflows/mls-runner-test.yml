name: MLSBD proxy indexing runner test
on:
  push:
    branches: [mls-index-runner-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Test Bangladesh proxy discovery and index acquisition
        working-directory: tools/mls-index-lab
        run: |
          set -euo pipefail
          python scan_bd.py
          python indexer.py --db runner.sqlite --proxy-list bd-results.json --pages 2 --mirror-limit 10
          python - <<'PY'
          import sqlite3,sys
          c=sqlite3.connect('runner.sqlite')
          posts=c.execute('select count(*) from posts').fetchone()[0]
          mirrors=c.execute('select count(*) from mirrors').fetchone()[0]
          print('RUNNER_RESULT posts=',posts,'mirror_sets=',mirrors)
          if posts<100 or mirrors<1:sys.exit(1)
          PY
