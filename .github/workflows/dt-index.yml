name: dt-index
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'max links this run'
        default: '2500'
permissions:
  contents: write
concurrency: dt-index
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: show current index
        run: node -e "const j=require('./dt_index.json');console.log('before n='+j.n+' cursor='+j.cursor)"
      - name: build index
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GH_REPO: \${{ github.repository }}
        run: node dt-index.mjs --max=\${{ github.event.inputs.max || '2500' }} --conc=30 --pages=29 --publish
