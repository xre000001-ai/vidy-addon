name: dt-index
# All site/gate work is background-only. Source and generated data are isolated.
on:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dt-index.yml'
      - 'dt-index3.mjs'
      - 'tools/deadtoons-index/**'
      - 'tools/source-review-tests/deadtoons-419.test.cjs'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Background work seconds per slice (90..2400)'
        default: '2100'
permissions:
  contents: read
concurrency:
  group: dt-index
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline index and exact preservation checks
        run: node --test tools/source-review-tests/deadtoons-419.test.cjs
      - uses: actions/checkout@v4
        with:
          ref: deadtoons-index
          path: .dt-data
          persist-credentials: false
      - id: base
        run: echo "sha=$(git -C .dt-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: One shared bounded catalog refresh
        run: node tools/deadtoons-index/cli.cjs catalog --data=.dt-data --out=.dt-plan --budget=${{ github.event_name == 'push' && '180' || '780' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dt-plan
          path: .dt-plan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slice: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.data_sha }}
          path: .dt-data
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dt-plan
          path: .dt-plan
      - name: Cooldown-respecting incremental slice
        env:
          DT_BUDGET: ${{ inputs.budget || (github.event_name == 'push' && '180' || '2100') }}
        run: node tools/deadtoons-index/cli.cjs slice --data=.dt-data --plan=.dt-plan --out=.dt-result --slice=${{ matrix.slice }} --slices=4 --want=2 --concurrency=6
      - uses: actions/upload-artifact@v4
        with:
          name: dt-slice-${{ matrix.slice }}
          path: .dt-result/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/checkout@v4
        with:
          ref: deadtoons-index
          fetch-depth: 1
          path: .dt-data
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dt-plan
          path: .dt-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: dt-slice-*
          path: .dt-results
      - name: Validate all owners and aggregate actual global coverage
        run: node tools/deadtoons-index/cli.cjs merge --data=.dt-data --plan=.dt-plan --results=.dt-results --out=.dt-output --slices=4
      - name: Atomic immutable-snapshot publication, fail visibly on error
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/deadtoons-index/cli.cjs publish --data=.dt-data --out=.dt-output --push=1
      - uses: actions/upload-artifact@v4
        with:
          name: dt-publication
          path: .dt-output/publication.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
