name: dt-index
# ★ Deadtoons **সম্পূর্ণ সাইট-কপি** ইনডেক্স (ইউজার: "puro website ta copy korba") — শুধু GitHub-এ বিল্ড হয়।
#   প্রোড অ্যাডন শুধু `dti/manifest.json` + প্রয়োজনীয় শার্ড পড়ে (ডাউনলোড-লিঙ্ক আগেই প্রমাণিত)।
on:
  schedule:
    - cron: '11 * * * *'        # প্রতি ঘণ্টা — কভারেজ ক্রমাগত পূর্ণ হতে থাকে
  workflow_dispatch:
    inputs:
      want:
        description: 'hosts per unit (1 = HubCloud-first full sweep, 2 = add Pixeldrain mirror)'
        default: '1'
      budget:
        description: 'seconds of work this run'
        default: '2700'
permissions:
  contents: write
concurrency: dt-index
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: index before
        run: |
          node -e "try{const m=require('./dti/manifest.json');console.log('before n='+m.n+' units='+JSON.stringify(m.units))}catch(e){console.log('before: no shards yet')}"
      - name: build (GitHub-side only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node dt-index3.mjs
          --budget=${{ github.event.inputs.budget || '2700' }}
          --want=${{ github.event.inputs.want || '1' }}
          --scan=30 --conc=56 --max=20000 --publish
      - name: index after
        run: |
          node -e "const m=require('./dti/manifest.json');console.log('after n='+m.n+' units='+JSON.stringify(m.units)+' shards='+m.shards)"
          ls -la dti | head -6
