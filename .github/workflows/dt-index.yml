name: dt-index
# ★ Deadtoons **সম্পূর্ণ সাইট-কপি** ইনডেক্স (ইউজার: "puro website ta copy korba") — শুধু GitHub-এ বিল্ড হয়।
#   ৫টি স্লাইস-জব সমান্তরালে চলে (প্রতিটি নিজের শার্ডই লেখে ⇒ সংঘর্ষ নেই), প্রতি ঘণ্টায়।
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      want:
        description: 'hosts per unit (1 = HubCloud-first full sweep, 2 = add Pixeldrain mirror)'
        default: '1'
      budget:
        description: 'seconds of work per job'
        default: '2700'
permissions:
  contents: write
concurrency: dt-index
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slice: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build slice ${{ matrix.slice }} (GitHub-side only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node dt-index3.mjs
          --budget=${{ github.event.inputs.budget || '2700' }}
          --want=${{ github.event.inputs.want || '1' }}
          --slice=${{ matrix.slice }} --slices=5
          --scan=30 --conc=56 --max=20000 --publish
      - name: after
        run: node -e "try{const m=require('./dti/manifest.json');console.log('after n='+m.n+' units='+JSON.stringify(m.units))}catch(e){console.log('no manifest in this workspace (slice '+${{ matrix.slice }}+')')}"
